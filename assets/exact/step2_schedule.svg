<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="50%" stop-color="#FFF5F8"/>
      <stop offset="100%" stop-color="#F3F4F8"/>
    </linearGradient>

    <!-- Ambient Mesh Glow -->
    <radialGradient id="meshGlow2" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#7928CA" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#F2006D" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FAF5FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Phone Chassis Gradient -->
    <linearGradient id="phoneChassis2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C2C2E"/>
      <stop offset="50%" stop-color="#1C1C1E"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>

    <linearGradient id="phoneBorder2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#55555C"/>
      <stop offset="100%" stop-color="#2C2C2E"/>
    </linearGradient>

    <!-- Screen Background -->
    <linearGradient id="screenBg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E0E11"/>
      <stop offset="100%" stop-color="#141418"/>
    </linearGradient>

    <!-- Timeblock Primary Gradient -->
    <linearGradient id="blockPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2006D"/>
      <stop offset="100%" stop-color="#7928CA"/>
    </linearGradient>

    <linearGradient id="blockSecondaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2333"/>
      <stop offset="100%" stop-color="#161925"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="phoneShadow2" x="-20%" y="-15%" width="140%" height="135%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.16"/>
    </filter>

    <filter id="blockGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#F2006D" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="540" fill="url(#bgGrad2)" rx="24"/>
  <rect width="800" height="540" fill="url(#meshGlow2)" rx="24"/>

  <!-- Phone Container Group -->
  <g transform="translate(240, 28)" filter="url(#phoneShadow2)">
    <!-- Phone Bezel / Chassis -->
    <rect x="0" y="0" width="320" height="500" rx="46" fill="url(#phoneChassis2)" stroke="url(#phoneBorder2)" stroke-width="3"/>

    <!-- Screen Glass -->
    <rect x="10" y="10" width="300" height="480" rx="38" fill="url(#screenBg2)"/>

    <!-- Dynamic Island Pill -->
    <rect x="110" y="22" width="100" height="26" rx="13" fill="#000000"/>
    <circle cx="188" cy="35" r="5" fill="#1C1C1E"/>
    <circle cx="188" cy="35" r="2.5" fill="#0A2540"/>

    <!-- Status Bar (Time) -->
    <text x="36" y="38" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="12" font-weight="600" letter-spacing="-0.02em">9:41</text>
    
    <!-- Header Row -->
    <text x="32" y="80" fill="#888892" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="10" font-weight="700" letter-spacing="0.08em">VALI · SMART TIMEBLOCKING</text>
    <text x="32" y="108" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="20" font-weight="800" letter-spacing="-0.03em">Tuesday, Nov 14</text>

    <!-- Mini Calendar Strip -->
    <g transform="translate(32, 122)">
      <rect x="0" y="0" width="38" height="46" rx="12" fill="#202026"/>
      <text x="12" y="18" fill="#787884" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="9" font-weight="600">MON</text>
      <text x="13" y="36" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="13" font-weight="700">13</text>

      <rect x="46" y="0" width="44" height="46" rx="12" fill="#F2006D"/>
      <text x="56" y="18" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="9" font-weight="700">TUE</text>
      <text x="59" y="36" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="14" font-weight="800">14</text>

      <rect x="98" y="0" width="38" height="46" rx="12" fill="#202026"/>
      <text x="108" y="18" fill="#787884" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="9" font-weight="600">WED</text>
      <text x="109" y="36" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="13" font-weight="700">15</text>

      <rect x="144" y="0" width="38" height="46" rx="12" fill="#202026"/>
      <text x="156" y="18" fill="#787884" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="9" font-weight="600">THU</text>
      <text x="157" y="36" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="13" font-weight="700">16</text>

      <rect x="190" y="0" width="38" height="46" rx="12" fill="#202026"/>
      <text x="202" y="18" fill="#787884" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="9" font-weight="600">FRI</text>
      <text x="203" y="36" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="13" font-weight="700">17</text>
    </g>

    <!-- Timeline Grid Area -->
    <!-- Time Slot 1: 09:00 -->
    <text x="28" y="196" fill="#666672" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="10" font-weight="600">09:00</text>
    <line x1="62" y1="192" x2="288" y2="192" stroke="#22222A" stroke-width="1"/>

    <!-- Vivid Active Block 1 (Drag & Drop Primary Sprint) -->
    <g transform="translate(62, 202)" filter="url(#blockGlow)">
      <rect x="0" y="0" width="226" height="88" rx="16" fill="url(#blockPrimaryGrad)"/>
      <!-- Drag Grip Dots -->
      <circle cx="212" cy="18" r="2" fill="#FFFFFF" fill-opacity="0.7"/>
      <circle cx="218" cy="18" r="2" fill="#FFFFFF" fill-opacity="0.7"/>
      <circle cx="212" cy="24" r="2" fill="#FFFFFF" fill-opacity="0.7"/>
      <circle cx="218" cy="24" r="2" fill="#FFFFFF" fill-opacity="0.7"/>

      <text x="16" y="24" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="9.5" font-weight="800" letter-spacing="0.04em">09:00 - 10:30</text>
      <text x="16" y="46" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="14" font-weight="800" letter-spacing="-0.02em">Deep Focus Sprint</text>
      <text x="16" y="66" fill="#FFD0E5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="10.5" font-weight="600">Vali Focus Mode · 90m block</text>
    </g>

    <!-- Time Slot 2: 11:00 -->
    <text x="28" y="318" fill="#666672" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="10" font-weight="600">11:00</text>
    <line x1="62" y1="314" x2="288" y2="314" stroke="#22222A" stroke-width="1"/>

    <!-- Secondary Synced Block 2 -->
    <g transform="translate(62, 324)">
      <rect x="0" y="0" width="226" height="66" rx="16" fill="url(#blockSecondaryGrad)" stroke="#2B3248" stroke-width="1"/>
      <circle cx="18" cy="22" r="4" fill="#0078D4"/>
      <text x="28" y="25" fill="#8896B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="9" font-weight="700">11:00 - 11:45 · GOOGLE SYNC</text>
      <text x="18" y="47" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="12.5" font-weight="700">Design System Alignment</text>
    </g>

    <!-- Bottom Harmonized Status Banner -->
    <g transform="translate(24, 412)">
      <rect x="0" y="0" width="272" height="38" rx="19" fill="#1A1A22" stroke="#2D2D38" stroke-width="1"/>
      <circle cx="20" cy="19" r="6" fill="#00C853"/>
      <path d="M17 19l2 2 4-4" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <text x="34" y="23" fill="#E2E2EA" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="10.5" font-weight="600">3 Calendars Harmonized · No Conflicts</text>
    </g>

    <!-- Home Indicator -->
    <rect x="95" y="472" width="130" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.3"/>
  </g>
</svg>

