<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F8"/>
      <stop offset="50%" stop-color="#FDF3FA"/>
      <stop offset="100%" stop-color="#F2F3FA"/>
    </linearGradient>

    <!-- Deep Ambient Glow -->
    <radialGradient id="meshGlow3" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#F2006D" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#570080" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFF5F8" stop-opacity="0"/>
    </radialGradient>

    <!-- Phone Chassis Gradient -->
    <linearGradient id="phoneChassis3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C2C2E"/>
      <stop offset="50%" stop-color="#1C1C1E"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>

    <linearGradient id="phoneBorder3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#55555C"/>
      <stop offset="100%" stop-color="#2C2C2E"/>
    </linearGradient>

    <!-- Screen Background -->
    <linearGradient id="screenBg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E0E12"/>
      <stop offset="100%" stop-color="#16141C"/>
    </linearGradient>

    <!-- Timer Ring Gradient -->
    <linearGradient id="timerRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0080"/>
      <stop offset="50%" stop-color="#F2006D"/>
      <stop offset="100%" stop-color="#FF5E3A"/>
    </linearGradient>

    <!-- Soundwave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF0080"/>
      <stop offset="100%" stop-color="#7928CA"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="phoneShadow3" x="-20%" y="-15%" width="140%" height="135%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.16"/>
    </filter>

    <filter id="orbGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#F2006D" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="540" fill="url(#bgGrad3)" rx="24"/>
  <rect width="800" height="540" fill="url(#meshGlow3)" rx="24"/>

  <!-- Phone Container Group -->
  <g transform="translate(240, 28)" filter="url(#phoneShadow3)">
    <!-- Phone Bezel / Chassis -->
    <rect x="0" y="0" width="320" height="500" rx="46" fill="url(#phoneChassis3)" stroke="url(#phoneBorder3)" stroke-width="3"/>

    <!-- Screen Glass -->
    <rect x="10" y="10" width="300" height="480" rx="38" fill="url(#screenBg3)"/>

    <!-- Dynamic Island Pill -->
    <rect x="110" y="22" width="100" height="26" rx="13" fill="#000000"/>
    <circle cx="188" cy="35" r="5" fill="#1C1C1E"/>
    <circle cx="188" cy="35" r="2.5" fill="#0A2540"/>

    <!-- Status Bar (Time) -->
    <text x="36" y="38" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="12" font-weight="600" letter-spacing="-0.02em">9:41</text>
    
    <!-- Header Row -->
    <text x="32" y="80" fill="#888892" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="10" font-weight="700" letter-spacing="0.08em">VALI · FOCUS SHIELD</text>
    
    <!-- Active State Pill -->
    <g transform="translate(32, 94)">
      <rect x="0" y="0" width="126" height="24" rx="12" fill="#F2006D" fill-opacity="0.18" stroke="#F2006D" stroke-opacity="0.4"/>
      <circle cx="12" cy="12" r="4" fill="#FF0080"/>
      <text x="22" y="16" fill="#FF4088" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="9.5" font-weight="800" letter-spacing="0.05em">FLOW ACTIVE</text>
    </g>

    <!-- Central Radial Timer Ring Display -->
    <g transform="translate(160, 218)">
      <!-- Outer Track Ring -->
      <circle cx="0" cy="0" r="76" fill="none" stroke="#262430" stroke-width="9"/>
      
      <!-- Progress Arc Ring (75% completed) -->
      <circle cx="0" cy="0" r="76" fill="none" stroke="url(#timerRingGrad)" stroke-width="9" stroke-linecap="round" stroke-dasharray="358 120" stroke-dashoffset="60" filter="url(#orbGlow)"/>

      <!-- Inner Ambient Glow Circle -->
      <circle cx="0" cy="0" r="62" fill="#191522"/>

      <!-- Digital Countdown -->
      <text x="0" y="8" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="34" font-weight="800" text-anchor="middle" letter-spacing="-0.03em">24:48</text>
      
      <text x="0" y="28" fill="#FF80B5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.08em">POMODORO SPRINT</text>
    </g>

    <!-- Active Focus Task Title -->
    <text x="160" y="324" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="-0.01em">Design System Review 2.0</text>
    <text x="160" y="342" fill="#888898" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="10.5" font-weight="500" text-anchor="middle">Session 2 of 4 · Deep Flow</text>

    <!-- Ambient Soundscape Player Widget -->
    <g transform="translate(24, 362)">
      <rect x="0" y="0" width="272" height="48" rx="16" fill="#1C1A24" stroke="#2E2838" stroke-width="1"/>
      
      <!-- Headphones Icon Circle -->
      <circle cx="26" cy="24" r="14" fill="#2E2235"/>
      <path d="M20 25v-2a6 6 0 0 1 12 0v2M19 25a2 2 0 0 1 2-2h1v5h-1a2 2 0 0 1-2-2zM30 25a2 2 0 0 1 2-2h1v5h-1a2 2 0 0 1-2-2z" fill="none" stroke="#FF4088" stroke-width="1.6" stroke-linecap="round"/>

      <text x="48" y="20" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="11" font-weight="700">Lo-Fi Binaural Waves</text>
      <text x="48" y="34" fill="#888898" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="9" font-weight="500">Ambient Flow · 432 Hz</text>

      <!-- Animated Sound Wave Bars -->
      <g transform="translate(228, 14)">
        <rect x="0" y="4" width="3" height="12" rx="1.5" fill="url(#waveGrad)"/>
        <rect x="5" y="0" width="3" height="20" rx="1.5" fill="url(#waveGrad)"/>
        <rect x="10" y="7" width="3" height="9" rx="1.5" fill="url(#waveGrad)"/>
        <rect x="15" y="2" width="3" height="16" rx="1.5" fill="url(#waveGrad)"/>
        <rect x="20" y="8" width="3" height="8" rx="1.5" fill="url(#waveGrad)"/>
      </g>
    </g>

    <!-- Bottom DND Status Pill -->
    <g transform="translate(24, 420)">
      <rect x="0" y="0" width="272" height="34" rx="17" fill="#16141D" stroke="#252230" stroke-width="1"/>
      <circle cx="18" cy="17" r="4" fill="#F2006D"/>
      <text x="30" y="21" fill="#D0D0DC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="10" font-weight="600">🌙 Distraction Shield · Notifications Silenced</text>
    </g>

    <!-- Home Indicator -->
    <rect x="95" y="472" width="130" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.3"/>
  </g>
</svg>

