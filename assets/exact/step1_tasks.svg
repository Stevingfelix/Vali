<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F7"/>
      <stop offset="50%" stop-color="#FAF5FC"/>
      <stop offset="100%" stop-color="#F2F3F8"/>
    </linearGradient>

    <!-- Ambient Mesh Glow -->
    <radialGradient id="meshGlow1" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#F2006D" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#7928CA" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FAF5FC" stop-opacity="0"/>
    </radialGradient>

    <!-- Phone Chassis Gradient -->
    <linearGradient id="phoneChassis1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C2C2E"/>
      <stop offset="50%" stop-color="#1C1C1E"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>

    <!-- Phone Inner Border -->
    <linearGradient id="phoneBorder1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#55555C"/>
      <stop offset="100%" stop-color="#2C2C2E"/>
    </linearGradient>

    <!-- Screen Background -->
    <linearGradient id="screenBg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E0E11"/>
      <stop offset="100%" stop-color="#141418"/>
    </linearGradient>

    <!-- Active Task Gradient -->
    <linearGradient id="taskActiveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241B28"/>
      <stop offset="100%" stop-color="#1E1922"/>
    </linearGradient>

    <!-- Accent Pill Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2006D"/>
      <stop offset="100%" stop-color="#FF5E3A"/>
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="phoneShadow1" x="-20%" y="-15%" width="140%" height="135%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.16"/>
    </filter>

    <filter id="taskGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#F2006D" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="540" fill="url(#bgGrad1)" rx="24"/>
  <rect width="800" height="540" fill="url(#meshGlow1)" rx="24"/>

  <!-- Phone Container Group -->
  <g transform="translate(240, 28)" filter="url(#phoneShadow1)">
    <!-- Phone Bezel / Chassis -->
    <rect x="0" y="0" width="320" height="500" rx="46" fill="url(#phoneChassis1)" stroke="url(#phoneBorder1)" stroke-width="3"/>

    <!-- Screen Glass -->
    <rect x="10" y="10" width="300" height="480" rx="38" fill="url(#screenBg1)"/>

    <!-- Dynamic Island Pill -->
    <rect x="110" y="22" width="100" height="26" rx="13" fill="#000000"/>
    <circle cx="188" cy="35" r="5" fill="#1C1C1E"/>
    <circle cx="188" cy="35" r="2.5" fill="#0A2540"/>

    <!-- Status Bar (Time & Icons) -->
    <text x="36" y="38" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="12" font-weight="600" letter-spacing="-0.02em">9:41</text>
    
    <!-- Header Row -->
    <text x="32" y="80" fill="#888892" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="10" font-weight="700" letter-spacing="0.08em">VALI · INTELLIGENT RUNDOWN</text>
    <text x="32" y="108" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="20" font-weight="800" letter-spacing="-0.03em">Today's Focus</text>

    <!-- Filter Pills -->
    <rect x="32" y="122" width="56" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="44" y="137" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="10" font-weight="700">All (5)</text>

    <rect x="94" y="122" width="68" height="22" rx="11" fill="#F2006D" fill-opacity="0.18"/>
    <text x="104" y="137" fill="#FF4088" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="10" font-weight="700">Priority (3)</text>

    <!-- Task Card 1: Active Primary Task -->
    <g transform="translate(24, 158)">
      <rect x="0" y="0" width="272" height="74" rx="16" fill="url(#taskActiveGrad)" stroke="#F2006D" stroke-width="1.5" stroke-opacity="0.6"/>
      <!-- Checkbox Ring -->
      <circle cx="24" cy="37" r="11" fill="#F2006D" filter="url(#taskGlow)"/>
      <path d="M19 37l3.5 3.5 7-7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Task Content -->
      <text x="46" y="30" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="12" font-weight="700" letter-spacing="-0.01em">Design System Review 2.0</text>
      <text x="46" y="47" fill="#A0A0AB" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="10" font-weight="500">Design · 45 mins</text>
      
      <!-- Energy Badge -->
      <rect x="46" y="52" width="76" height="15" rx="7.5" fill="#FF7E5F" fill-opacity="0.2"/>
      <text x="52" y="63" fill="#FF9A7B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="8.5" font-weight="700">⚡ High Energy</text>
    </g>

    <!-- Task Card 2: Strategic Goal -->
    <g transform="translate(24, 242)">
      <rect x="0" y="0" width="272" height="72" rx="16" fill="#18181E" stroke="#2A2A35" stroke-width="1"/>
      <circle cx="24" cy="36" r="11" fill="none" stroke="#505060" stroke-width="1.8"/>
      
      <text x="46" y="30" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="12" font-weight="700" letter-spacing="-0.01em">Q4 Product Roadmap Strategy</text>
      <text x="46" y="47" fill="#888894" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="10" font-weight="500">Roadmap · 90 mins</text>

      <rect x="46" y="52" width="68" height="15" rx="7.5" fill="#7928CA" fill-opacity="0.25"/>
      <text x="52" y="63" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="8.5" font-weight="700">⭐ Deep Work</text>
    </g>

    <!-- Task Card 3: Team Sync -->
    <g transform="translate(24, 324)">
      <rect x="0" y="0" width="272" height="72" rx="16" fill="#18181E" stroke="#2A2A35" stroke-width="1"/>
      <circle cx="24" cy="36" r="11" fill="none" stroke="#505060" stroke-width="1.8"/>
      
      <text x="46" y="30" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="12" font-weight="700" letter-spacing="-0.01em">Async Team Standup & Sync</text>
      <text x="46" y="47" fill="#888894" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="10" font-weight="500">Core Team · 20 mins</text>

      <rect x="46" y="52" width="68" height="15" rx="7.5" fill="#0070F3" fill-opacity="0.2"/>
      <text x="52" y="63" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="8.5" font-weight="700">💬 Low Energy</text>
    </g>

    <!-- Bottom Quick Add Bar -->
    <g transform="translate(24, 408)">
      <rect x="0" y="0" width="272" height="42" rx="21" fill="#202028" stroke="#333340" stroke-width="1"/>
      <circle cx="22" cy="21" r="10" fill="#F2006D"/>
      <path d="M22 17v8M18 21h8" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
      <text x="40" y="25" fill="#757582" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="11" font-weight="500">Capture a new priority...</text>
    </g>

    <!-- Home Indicator -->
    <rect x="95" y="472" width="130" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.3"/>
  </g>
</svg>

